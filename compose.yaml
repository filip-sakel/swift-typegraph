# scripts/up.sh, or docker compose up -d --build   →   http://localhost:${HTTP_PORT:-8080}
# On a server, .env sets SITE_ADDRESS to the domain and the ports to 80/443 (DEPLOY.md).

services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # One analyzer process per worker; jobs beyond these queue for up to 1 s.
      WORKERS: ${WORKERS:-4}
      CHECK_INVARIANTS: "1"
      MAX_SOURCE_BYTES: "8192"
      MAX_TIME_MS: "500"
      MAX_MEMORY_KIB: "10240"
    volumes:
      # failures.jsonl: every failed analysis with its input (see About).
      - failures:/var/log/typegraph
      - gateway_socket:/run/typegraph
    # No network: Caddy (web) reaches it through the socket, and it can't
    # reach anything.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    # Repeated from the Dockerfile: podman's default OCI image format drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/typegraph/gateway.sock", "http://localhost/api/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_BUG_REPORT_URL: ${BUG_REPORT_URL:-}
    environment:
      # ":80" serves plain HTTP; a domain turns on automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # The rate limit is per client address, so published ports must keep it.
    # Rootful docker's "bridge" does. Rootless podman needs "pasta": on bridge
    # networks it proxies ports through rootlessport, and every client shows
    # up as the container's own address. scripts/up.sh picks pasta for podman.
    network_mode: ${WEB_NETWORK_MODE:-bridge}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp" # HTTP/3
    volumes:
      # Certificates and ACME account; losing them means re-issuing, which
      # Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
      - gateway_socket:/run/typegraph:ro
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  failures:
  gateway_socket:
  caddy_data:
  caddy_config:
