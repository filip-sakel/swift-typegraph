# scripts/up.sh, or docker compose up -d --build   →   http://localhost:${HTTP_PORT:-4000}
# A private proxy on loopback; a public one in front adds TLS and the rate
# limit (DEPLOY.md).

services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # One analyzer process per worker; jobs beyond these queue for up to 1 s.
      WORKERS: ${WORKERS:-4}
      CHECK_INVARIANTS: "1"
      MAX_SOURCE_BYTES: "8192"
      MAX_TIME_MS: "500"
      MAX_MEMORY_KIB: "10240"
    volumes:
      # failures.jsonl: every failed analysis with its input (see About).
      - failures:/var/log/typegraph
      - gateway_socket:/run/typegraph
    # No network: Caddy (web) reaches it through the socket, and it can't
    # reach anything.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    # Repeated from the Dockerfile: podman's default OCI image format drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/typegraph/gateway.sock", "http://localhost/api/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_BUG_REPORT_URL: ${BUG_REPORT_URL:-}
    # Loopback only: a public port would bypass the rate limit.
    ports:
      - "127.0.0.1:${HTTP_PORT:-4000}:4000"
    environment:
      # Caddy's instance files; nothing here needs to persist.
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    volumes:
      - gateway_socket:/run/typegraph:ro
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  failures:
  gateway_socket:
