# Static files, plus /api proxied to the gateway (SPEC §7).

# Per-client request rate. The editor debounces at 300 ms, so a typing user
# sends ~3 requests/s; the burst absorbs Run presses and retries.
limit_req_zone $binary_remote_addr zone=analyze:10m rate=5r/s;

upstream gateway {
  server gateway:8080;
  keepalive 32;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints everything under /assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /api/analyze {
    limit_req zone=analyze burst=20 nodelay;
    limit_req_status 429;
    # 8 KiB of source, JSON-escaped, fits easily; the gateway checks the real limit.
    client_max_body_size 64k;
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
  }

  location /api/ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
